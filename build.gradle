plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"pocketpals" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "pocketpals-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft"com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Die Fabric API steckt mit im Mod-JAR, damit nur eine Datei installiert werden muss
	include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation "org.junit.jupiter:junit-jupiter-params"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

// Testet das fertige Mod-JAR wie bei einer echten Installation, ohne die Entwicklungsumgebung
def gametestJar = tasks.register('gametestJar', Jar) {
	from sourceSets.gametest.output
	archiveClassifier = 'gametest'
	destinationDirectory = layout.buildDirectory.dir('test-libs')
}

configurations {
	productionTestMods
}

dependencies {
	productionTestMods(fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)) {
		transitive = false
	}
}

tasks.register('productionClientTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(tasks.jar, gametestJar, configurations.productionTestMods)
	jvmArgs.add('-Dfabric.client.gametest')
	runDir = layout.buildDirectory.dir('run/production')
}
